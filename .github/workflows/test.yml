name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  shell: sh }     # dash: strict POSIX
          - { os: ubuntu-latest,  shell: bash }
          - { os: macos-latest,   shell: sh }     # bash 3.2 in POSIX mode
          - { os: windows-latest, shell: bash }   # Git Bash, as Claude Code uses
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        shell: bash
        run: sh -n bin/iriscale-voice && bash --posix -n bin/iriscale-voice
      - name: suite
        shell: bash
        env:
          IRISCALE_VOICE_DEBUG: "1"
        run: ${{ matrix.shell }} test/run.sh
      - name: runtime regression cases
        shell: bash
        run: ${{ matrix.shell }} test/audit-runtime.sh
      - name: help and status run
        shell: bash
        run: |
          ${{ matrix.shell }} bin/iriscale-voice --help >/dev/null
          ${{ matrix.shell }} bin/iriscale-voice status
          ${{ matrix.shell }} bin/iriscale-voice sessions --plain

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: versions agree
        run: |
          v=$(grep -o '^VERSION="[^"]*"' bin/iriscale-voice | cut -d'"' -f2)
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json package.json; do
            grep -q "\"version\": *\"$v\"" "$f" || { echo "$f is not at $v"; exit 1; }
          done
          echo "all at $v"
      - name: JSON parses
        run: for f in .claude-plugin/*.json .codex-plugin/*.json hooks/hooks.json package.json; do python3 -m json.tool "$f" >/dev/null || exit 1; done

  npm:
    name: npm installer / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines - test it, don't assume it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - name: installer suite
        shell: bash
        run: sh test/npm.sh
      - name: installer preservation regression cases
        run: node test/audit-installer.js
      - name: Codex notification and board regression cases
        run: node test/codex-board.js
      - name: standalone PowerShell installer preservation
        if: runner.os == 'Windows' && matrix.node == '22'
        run: node test/audit-installer.js --powershell
      - name: standalone PowerShell Codex notification
        if: runner.os == 'Windows' && matrix.node == '22'
        run: node test/codex-board.js --powershell
      - name: Codex hooks through the PowerShell session shell
        if: runner.os == 'Windows' && matrix.node == '22'
        run: |
          node test/codex-board.js --hook-powershell
          node test/codex-board.js --powershell --hook-powershell
      - name: pack and install globally, then run the shim
        shell: bash
        run: |
          npm pack
          npm install -g --prefix "$RUNNER_TEMP/npmglobal" ./iriscale-voice-*.tgz
          # npm puts global shims in <prefix>/bin on POSIX and <prefix> itself on Windows
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/npmglobal/iriscale-voice"
          else bin="$RUNNER_TEMP/npmglobal/bin/iriscale-voice"; fi
          "$bin" --version
          "$bin" status
          "$bin" install codex        # prints the plan, must write nothing
          "$bin" install claude       # ditto for the Claude Code route
          test -z "$("$bin" install claude | grep CLAUDE_PLUGIN_ROOT || true)"   # must be resolved
          # ...and wrote nothing: the plan is read-only (bash -e fails the step on either)
          test ! -e "$HOME/.codex"
          test ! -e "$HOME/.claude/settings.json"
